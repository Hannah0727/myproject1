
<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>註冊｜揪命啊</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-blue-50 text-slate-800">
  <main class="mx-auto flex min-h-screen max-w-md items-center px-6 py-12">
    <section class="w-full rounded-3xl border border-blue-100 bg-white p-8 shadow-sm">

      <a href="{% url 'chillme:event-list' %}"
         class="text-sm font-bold text-blue-600">
        ← 回到活動列表
      </a>

      <h1 class="mt-6 text-3xl font-black text-blue-900">
        加入揪命啊！
      </h1>

      <p class="mt-3 text-slate-500">
        建立帳號，開始揪團、探索活動，認識新朋友！
      </p>

      <form method="post"
            action="{% url 'account_signup' %}"
            class="mt-8 space-y-4">

        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit"
                class="w-full rounded-xl bg-blue-600 px-5 py-3 font-bold text-white hover:bg-blue-700">
          建立帳號
        </button>
      </form>

      <p class="mt-6 text-sm text-slate-500">
        已經有帳號了？
        <a href="{% url 'account_login' %}"
           class="font-bold text-blue-600">
          立即登入
        </a>
      </p>

    </section>
  </main>
</body>
</html>
