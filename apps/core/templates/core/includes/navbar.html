<header class="site-header sticky top-0 z-50 border-b border-slate-200/70 bg-white/90 backdrop-blur" data-site-navbar>
  <nav class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-3 px-5 py-4" aria-label="主要導覽">
    <a href="{% url 'core:home' %}" class="text-2xl font-black text-[var(--site-primary-dark)]">
      揪命啊<span class="text-[var(--site-accent)]">！</span>
    </a>
    <div class="flex flex-wrap items-center gap-3 text-sm font-semibold md:gap-5">
      <a href="{% url 'core:home' %}#how">怎麼開始</a>
      <a href="{% url 'core:home' %}#categories">探索類別</a>
      <a class="site-button site-button--secondary !px-4 !py-2" href="{% url 'chillme:event-list' %}">活動列表</a>
      {% if user.is_authenticated %}
        <a href="{% url 'chillme:dashboard' %}" class="font-bold text-[var(--site-ink)] hover:text-[var(--site-primary)] hover:underline">我的揪團</a>
        <a class="site-button site-button--primary !px-4 !py-2" href="{% url 'chillme:event-create' %}">發起活動</a>
        <form method="post" action="{% url 'account_logout' %}" class="inline">
          {% csrf_token %}
          <button type="submit" class="font-bold text-[var(--site-ink)] hover:text-[var(--site-primary)] hover:underline">登出</button>
        </form>
      {% else %}
        <a href="{% url 'account_login' %}" class="font-bold text-[var(--site-ink)] hover:text-[var(--site-primary)] hover:underline">登入</a>
        <a class="site-button site-button--primary !px-4 !py-2" href="{% url 'account_signup' %}">註冊</a>
      {% endif %}
    </div>
  </nav>
</header>
